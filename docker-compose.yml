services:
  backend:
    build: .
    container_name: documentary-genius-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PORT=5000
      - DB_PATH=/app/db_data/production.db
    volumes:
      # قاعدة البيانات وملفات الإنتاج تبقى محفوظة حتى بعد إعادة تشغيل الحاوية
      - documentary_genius_output:/app/output
      - documentary_genius_db:/app/db_data

volumes:
  documentary_genius_output:
  documentary_genius_db:
